<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius:12px; overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="badge-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" opacity="0.6"/>
      <circle cx="40" cy="0" r="1.5" fill="#3b82f6" opacity="0.3"/>
    </pattern>

    <!-- Filter glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Background subtle pulse */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.08); }
    }
    /* Flow lines animation */
    @keyframes dashFlow {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    /* Dynamic pill floats */
    @keyframes floatSlow1 {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-8px) translateX(4px); }
    }
    @keyframes floatSlow2 {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(8px) translateX(-4px); }
    }
    /* Pulse badge dots */
    @keyframes pingDot {
      0%, 100% { r: 3.5px; opacity: 1; }
      50% { r: 5.5px; opacity: 0.4; }
    }
    .orb-1 { animation: pulseGlow 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseGlow 10s ease-in-out infinite; transform-origin: 1000px 250px; }
    .flow-line { stroke-dasharray: 8 6; animation: dashFlow 20s linear infinite; }
    .pill-1 { animation: floatSlow1 6s ease-in-out infinite; }
    .pill-2 { animation: floatSlow2 7s ease-in-out infinite; }
    .status-dot { animation: pingDot 2.5s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bg-grad)"/>

  <!-- Subtle Glowing Orbs in Background -->
  <circle class="orb-1" cx="180" cy="90" r="140" fill="#3b82f6" filter="url(#glow)" opacity="0.3"/>
  <circle class="orb-2" cx="1020" cy="270" r="160" fill="#8b5cf6" filter="url(#glow)" opacity="0.25"/>

  <!-- Grid overlay -->
  <rect width="1200" height="360" fill="url(#grid)" opacity="0.85"/>

  <!-- Animated connecting pipelines in background -->
  <g opacity="0.35">
    <path class="flow-line" d="M 50 70 C 300 70, 250 180, 500 180 S 800 90, 1150 90" fill="none" stroke="#60a5fa" stroke-width="2"/>
    <path class="flow-line" d="M 50 290 C 350 290, 450 190, 750 190 S 950 290, 1150 290" fill="none" stroke="#a78bfa" stroke-width="2" style="animation-direction: reverse;"/>
  </g>

  <!-- Floating Dynamic Tech Cards / Pills (Background Layer) -->
  <g class="pill-1" opacity="0.85">
    <rect x="75" y="45" width="160" height="34" rx="17" fill="url(#badge-grad-1)" stroke="#334155" stroke-width="1.2"/>
    <circle class="status-dot" cx="95" cy="62" r="4" fill="#10b981"/>
    <text x="110" y="66" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="0.5">DEVSECOPS READY</text>
  </g>

  <g class="pill-2" opacity="0.85">
    <rect x="960" y="45" width="165" height="34" rx="17" fill="url(#badge-grad-1)" stroke="#334155" stroke-width="1.2"/>
    <circle class="status-dot" cx="980" cy="62" r="4" fill="#38bdf8"/>
    <text x="995" y="66" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="0.5">ENTERPRISE SCALE</text>
  </g>

  <g class="pill-2" opacity="0.85">
    <rect x="90" y="280" width="175" height="34" rx="17" fill="url(#badge-grad-1)" stroke="#334155" stroke-width="1.2"/>
    <circle class="status-dot" cx="110" cy="297" r="4" fill="#f59e0b"/>
    <text x="125" y="301" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="0.5">AGILE &amp; KANBAN</text>
  </g>

  <g class="pill-1" opacity="0.85">
    <rect x="955" y="280" width="170" height="34" rx="17" fill="url(#badge-grad-1)" stroke="#334155" stroke-width="1.2"/>
    <circle class="status-dot" cx="975" cy="297" r="4" fill="#ec4899"/>
    <text x="990" y="301" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="0.5">OPEN-SOURCE CORE</text>
  </g>

  <!-- Main Foreground Content Area -->
  <!-- Top Tag pill -->
  <g transform="translate(600, 85)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="0" y="4" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="700" letter-spacing="1.5">🚀 CURATED DIRECTORY &amp; BENCHMARK</text>
  </g>

  <!-- Title (Sharp foreground, perfectly clear) -->
  <g transform="translate(600, 155)">
    <text x="0" y="0" text-anchor="middle" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Enterprise Issue Tracking Platform
    </text>
    <text x="0" y="4" text-anchor="middle" font-size="44" font-weight="900" fill="url(#primary-glow)" opacity="0.25">
      Enterprise Issue Tracking Platform
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 202)">
    <text x="0" y="0" text-anchor="middle" fill="#94a3b8" font-size="16" font-weight="400" letter-spacing="0.2">
      Definitive guide to Enterprise Bug Tracking, Agile Delivery, ITSM &amp; Open-Source Work Management
    </text>
  </g>

  <!-- Metrics / Features Line -->
  <g transform="translate(600, 245)">
    <rect x="-240" y="-16" width="480" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" fill="#cbd5e1" font-size="13" font-weight="500">
      ⚡ SaaS Market Pricing &#160;•&#160; 🛡️ Free Tier Limits &#160;•&#160; ⭐ Star Ranked OSS
    </text>
  </g>
</svg>
